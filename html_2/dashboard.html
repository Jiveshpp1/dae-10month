<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Dashboard</title>
    <link rel="stylesheet" href="aiarea.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
        }

        .dashboard-header {
            max-width: 1400px;
            margin: 30px auto 20px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h1 {
            margin: 0;
            color: #2ecc71;
            font-size: 32px;
        }

        .dashboard-header button {
            background: #459b71;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }

        .dashboard-header button:hover {
            background: #2ecc71;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .action-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .action-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #222 100%);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .action-card:hover {
            border-color: #2ecc71;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            transform: translateY(-5px);
        }

        .action-card i {
            font-size: 32px;
            color: #2ecc71;
        }

        .action-card h3 {
            margin: 0;
            color: #e0e0e0;
        }

        .action-card p {
            margin: 0;
            color: #888;
            font-size: 12px;
        }

        .classes-container {
            margin-bottom: 40px;
        }

        .class-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .class-header {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.1) 0%, rgba(69, 155, 113, 0.1) 100%);
            border-bottom: 2px solid #333;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .class-color-indicator {
            width: 10px;
            height: 40px;
            border-radius: 4px;
        }

        .class-header-text {
            flex: 1;
        }

        .class-header h2 {
            margin: 0;
            color: #2ecc71;
            font-size: 20px;
        }

        .class-header-desc {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }

        .class-toggle-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            padding: 0 10px;
            transition: all 0.3s;
        }

        .class-toggle-btn:hover {
            color: #2ecc71;
        }

        .class-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-height: 800px;
            overflow-y: auto;
            background: #0d0d0d;
        }

        .class-content.collapsed {
            display: none;
        }

        .content-subsection {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
        }

        .subsection-title {
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .items-list::-webkit-scrollbar {
            width: 6px;
        }

        .items-list::-webkit-scrollbar-track {
            background: #111;
            border-radius: 3px;
        }

        .items-list::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .items-list::-webkit-scrollbar-thumb:hover {
            background: #459b71;
        }

        .item-mini {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            color: #bbb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .item-mini:hover {
            border-color: #459b71;
            background: #111;
        }

        .item-mini-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-mini-actions {
            display: flex;
            gap: 6px;
        }

        .item-mini-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 3px 6px;
            font-size: 11px;
            transition: all 0.3s;
        }

        .item-mini-btn:hover {
            color: #2ecc71;
        }

        .empty-subsection {
            color: #666;
            font-size: 12px;
            text-align: center;
            padding: 15px 10px;
        }

        .uncategorized-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .uncategorized-section h2 {
            color: #2ecc71;
            margin-top: 0;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
        }

        .item-card:hover {
            border-color: #459b71;
            background: #111;
        }

        .item-title {
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-preview {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
            max-height: 60px;
            overflow: hidden;
            line-height: 1.3;
        }

        .item-actions {
            display: flex;
            gap: 6px;
        }

        .item-btn {
            background: none;
            border: 1px solid #333;
            color: #666;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            flex: 1;
        }

        .item-btn:hover {
            border-color: #459b71;
            color: #2ecc71;
        }

        .item-btn.delete:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="landing.html">Landing</a></li>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="aiarea.html">AI Area</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="#" id="signout-link">Sign Out</a></li>
            </ul>
        </nav>
    </header>

    <div class="dashboard-header">
        <h1>📚 Study Dashboard</h1>
        <button onclick="window.location.href='manage-classes.html'">
            <i class="fas fa-cog"></i> Manage Classes
        </button>
    </div>

    <div class="dashboard-container">
        <!-- Quick Actions -->
        <div class="action-cards">
            <a href="create-flashcards.html" class="action-card">
                <i class="fas fa-sparkles"></i>
                <h3>Create Flashcards</h3>
                <p>Generate flashcards with AI</p>
            </a>
            
            <a href="create-lesson-plans.html" class="action-card">
                <i class="fas fa-book"></i>
                <h3>Create Lesson Plan</h3>
                <p>Design structured lesson plans</p>
            </a>

            <a href="create-study-guides.html" class="action-card">
                <i class="fas fa-scroll"></i>
                <h3>Create Study Guide</h3>
                <p>Generate study guides with AI</p>
            </a>

            <a href="aiarea.html" class="action-card">
                <i class="fas fa-comments"></i>
                <h3>AI Study Chat</h3>
                <p>Chat with AI for help</p>
            </a>
        </div>

        <!-- Classes Sections -->
        <div class="classes-container" id="classes-container"></div>

        <!-- Uncategorized Content -->
        <div id="uncategorized-section" class="uncategorized-section" style="display:none;">
            <h2><i class="fas fa-inbox"></i> Uncategorized Content</h2>
            <div id="uncategorized-content" class="items-grid"></div>
        </div>
    </div>

    <!-- View Lesson Modal -->
    <div id="lesson-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeLessonModal()">&times;</span>
            <h2 id="lesson-modal-title"></h2>
            <div id="lesson-modal-body"></div>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('user_id');
        const userName = localStorage.getItem('user_name');

        if (!userName) {
            alert('Please log in first');
            window.location.href = 'login.html';
        }

        document.getElementById('signout-link').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'landing.html';
        });

        let classes = [];
        let allContent = { flashcards: [], lessons: [], guides: [] };

        async function loadClasses() {
            try {
                const res = await fetch(`http://localhost:3000/classes/${userId}`);
                classes = await res.json() || [];
                renderClasses();
            } catch (err) {
                console.error('Error loading classes:', err);
            }
        }

        async function loadContent() {
            try {
                const [fcRes, lpRes, sgRes] = await Promise.all([
                    fetch(`http://localhost:3000/flashcards/${userId}`),
                    fetch(`http://localhost:3000/lesson-plans/${userId}`),
                    fetch(`http://localhost:3000/study-guides/${userId}`)
                ]);

                allContent.flashcards = await fcRes.json() || [];
                allContent.lessons = await lpRes.json() || [];
                allContent.guides = await sgRes.json() || [];

                renderClasses();
                renderUncategorized();
            } catch (err) {
                console.error('Error loading content:', err);
            }
        }

        function renderClasses() {
            const container = document.getElementById('classes-container');
            container.innerHTML = classes.map(cls => {
                const fcInClass = allContent.flashcards.filter(f => f.class_id === cls.id);
                const lpInClass = allContent.lessons.filter(l => l.class_id === cls.id);
                const sgInClass = allContent.guides.filter(g => g.class_id === cls.id);
                const totalItems = fcInClass.length + lpInClass.length + sgInClass.length;

                return `
                    <div class="class-section" data-class-id="${cls.id}">
                        <div class="class-header" onclick="toggleClass(${cls.id})">
                            <div class="class-color-indicator" style="background:${cls.color}"></div>
                            <div class="class-header-text">
                                <h2>${cls.class_name}</h2>
                                <div class="class-header-desc">${cls.description || 'No description'} • ${totalItems} items</div>
                            </div>
                            <button class="class-toggle-btn" id="toggle-btn-${cls.id}">
                                <i class="fas fa-chevron-down"></i>
                            </button>
                        </div>
                        <div class="class-content" id="content-${cls.id}">
                            ${renderClassContent(fcInClass, lpInClass, sgInClass, cls.color)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderClassContent(flashcards, lessons, guides, color) {
            return `
                <div class="content-subsection">
                    <div class="subsection-title">
                        <i class="fas fa-layer-group"></i> Flashcards (${flashcards.length})
                    </div>
                    <div class="items-list">
                        ${flashcards.length > 0 ? flashcards.map(f => `
                            <div class="item-mini">
                                <span class="item-mini-text">${escapeHtml(f.title || 'Untitled')}</span>
                                <div class="item-mini-actions">
                                    <button class="item-mini-btn" onclick="viewFlashcard(${f.id})">View</button>
                                    <button class="item-mini-btn" onclick="deleteFlashcard(${f.id})">Delete</button>
                                </div>
                            </div>
                        `).join('') : '<div class="empty-subsection">No flashcards</div>'}
                    </div>
                </div>

                <div class="content-subsection">
                    <div class="subsection-title">
                        <i class="fas fa-book"></i> Lesson Plans (${lessons.length})
                    </div>
                    <div class="items-list">
                        ${lessons.length > 0 ? lessons.map(l => `
                            <div class="item-mini">
                                <span class="item-mini-text">${escapeHtml(l.title || 'Untitled')}</span>
                                <div class="item-mini-actions">
                                    <button class="item-mini-btn" onclick="viewLesson(${l.id})">View</button>
                                    <button class="item-mini-btn" onclick="deleteLesson(${l.id})">Delete</button>
                                </div>
                            </div>
                        `).join('') : '<div class="empty-subsection">No lessons</div>'}
                    </div>
                </div>

                <div class="content-subsection">
                    <div class="subsection-title">
                        <i class="fas fa-scroll"></i> Study Guides (${guides.length})
                    </div>
                    <div class="items-list">
                        ${guides.length > 0 ? guides.map(g => `
                            <div class="item-mini">
                                <span class="item-mini-text">${escapeHtml(g.title || 'Untitled')}</span>
                                <div class="item-mini-actions">
                                    <button class="item-mini-btn" onclick="viewGuide(${g.id})">View</button>
                                    <button class="item-mini-btn" onclick="deleteGuide(${g.id})">Delete</button>
                                </div>
                            </div>
                        `).join('') : '<div class="empty-subsection">No guides</div>'}
                    </div>
                </div>
            `;
        }

        function renderUncategorized() {
            const fcUncategorized = allContent.flashcards.filter(f => !f.class_id);
            const lpUncategorized = allContent.lessons.filter(l => !l.class_id);
            const sgUncategorized = allContent.guides.filter(g => !g.class_id);
            const totalUncategorized = fcUncategorized.length + lpUncategorized.length + sgUncategorized.length;

            if (totalUncategorized === 0) {
                document.getElementById('uncategorized-section').style.display = 'none';
                return;
            }

            document.getElementById('uncategorized-section').style.display = 'block';
            const content = document.getElementById('uncategorized-content');
            content.innerHTML = `
                ${fcUncategorized.length > 0 ? `<h4 style="grid-column:1/-1;color:#888;margin:10px 0 5px 0;font-size:12px;">📚 Flashcards</h4>` : ''}
                ${fcUncategorized.map(f => createItemCard(f, 'flashcard')).join('')}
                
                ${lpUncategorized.length > 0 ? `<h4 style="grid-column:1/-1;color:#888;margin:10px 0 5px 0;font-size:12px;">📖 Lesson Plans</h4>` : ''}
                ${lpUncategorized.map(l => createItemCard(l, 'lesson')).join('')}
                
                ${sgUncategorized.length > 0 ? `<h4 style="grid-column:1/-1;color:#888;margin:10px 0 5px 0;font-size:12px;">✏️ Study Guides</h4>` : ''}
                ${sgUncategorized.map(g => createItemCard(g, 'guide')).join('')}
            `;
        }

        function createItemCard(item, type) {
            const preview = item.content?.substring(0, 80) || item.description?.substring(0, 80) || 'No preview';
            const actions = type === 'flashcard' ? 'viewFlashcard' : type === 'lesson' ? 'viewLesson' : 'viewGuide';
            const deleteFunc = type === 'flashcard' ? 'deleteFlashcard' : type === 'lesson' ? 'deleteLesson' : 'deleteGuide';
            const id = item.id;

            return `
                <div class="item-card">
                    <div class="item-title">${escapeHtml(item.title || 'Untitled')}</div>
                    <div class="item-preview">${escapeHtml(preview)}</div>
                    <div class="item-actions">
                        <button class="item-btn" onclick="${actions}(${id})">View</button>
                        <button class="item-btn delete" onclick="${deleteFunc}(${id})">Delete</button>
                    </div>
                </div>
            `;
        }

        function toggleClass(classId) {
            const content = document.getElementById(`content-${classId}`);
            const btn = document.getElementById(`toggle-btn-${classId}`);
            content.classList.toggle('collapsed');
            btn.innerHTML = content.classList.contains('collapsed') ? '<i class="fas fa-chevron-right"></i>' : '<i class="fas fa-chevron-down"></i>';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function viewFlashcard(id) {
            const fc = allContent.flashcards.find(f => f.id === id);
            if (!fc) return;
            alert(`Flashcards: ${fc.title || 'Untitled'}\n\n${fc.content.substring(0, 200)}`);
        }

        function viewLesson(id) {
            const lesson = allContent.lessons.find(l => l.id === id);
            if (!lesson) return;
            const modal = document.getElementById('lesson-modal');
            document.getElementById('lesson-modal-title').textContent = lesson.title || 'Untitled';
            document.getElementById('lesson-modal-body').innerHTML = lesson.content || 'No content';
            modal.classList.add('active');
        }

        function viewGuide(id) {
            const guide = allContent.guides.find(g => g.id === id);
            if (!guide) return;
            const modal = document.getElementById('lesson-modal');
            document.getElementById('lesson-modal-title').textContent = guide.title || 'Untitled';
            document.getElementById('lesson-modal-body').innerHTML = guide.content || 'No content';
            modal.classList.add('active');
        }

        function closeLessonModal() {
            document.getElementById('lesson-modal').classList.remove('active');
        }

        async function deleteFlashcard(id) {
            if (!confirm('Delete this flashcard?')) return;
            try {
                await fetch(`http://localhost:3000/flashcards/${id}`, { method: 'DELETE' });
                loadContent();
            } catch (err) {
                alert('Error deleting: ' + err.message);
            }
        }

        async function deleteLesson(id) {
            if (!confirm('Delete this lesson?')) return;
            try {
                await fetch(`http://localhost:3000/lesson-plans/${id}`, { method: 'DELETE' });
                loadContent();
            } catch (err) {
                alert('Error deleting: ' + err.message);
            }
        }

        async function deleteGuide(id) {
            if (!confirm('Delete this guide?')) return;
            try {
                await fetch(`http://localhost:3000/study-guides/${id}`, { method: 'DELETE' });
                loadContent();
            } catch (err) {
                alert('Error deleting: ' + err.message);
            }
        }

        window.toggleClass = toggleClass;
        window.viewFlashcard = viewFlashcard;
        window.viewLesson = viewLesson;
        window.viewGuide = viewGuide;
        window.closeLessonModal = closeLessonModal;
        window.deleteFlashcard = deleteFlashcard;
        window.deleteLesson = deleteLesson;
        window.deleteGuide = deleteGuide;

        // Load on init
        loadClasses();
        loadContent();
    </script>
</body>
</html>
